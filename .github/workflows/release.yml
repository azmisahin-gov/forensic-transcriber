name: Release (build & publish)

# Builds and publishes the Windows release. Two ways in:
#  - called by the version workflow (`release-version.yml`) after it has
#    committed the bump and pushed the vX.Y.Z tag, or
#  - started manually with an existing tag (for a rebuild or a re-publish).
#
# The tag/version consistency is re-checked here so a tag can never publish a
# commit whose package.json disagrees with it.

on:
  workflow_call:
    inputs:
      tag:
        description: 'Release tag (vX.Y.Z)'
        required: true
        type: string
      version:
        description: 'Application version (X.Y.Z)'
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag (vX.Y.Z)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  verify-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
      tag: ${{ steps.check.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install dependencies
        run: npm ci || npm install
      - name: Check tag and package.json agree
        id: check
        run: |
          set -e
          TAG="${{ inputs.tag }}"
          APP_VERSION=$(node -p "require('./package.json').version")
          node -e "
            const v = require('./src/shared/versioning');
            const r = v.checkTagVersionConsistency('${TAG}', '${APP_VERSION}');
            if (!r.ok) { console.error('Refusing to publish: ' + r.message); process.exit(1); }
            console.log('Tag and version agree: ' + r.version);
          "
          if [ -n "${{ inputs.version }}" ] && [ "${{ inputs.version }}" != "$APP_VERSION" ]; then
            echo "Refusing: requested version ${{ inputs.version }} does not match package.json $APP_VERSION"
            exit 1
          fi
          echo "version=${APP_VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

  build-windows:
    needs: verify-version
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.verify-version.outputs.tag }}

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm ci || npm install

      - name: Build whisper.cpp (static CPU, Windows x64)
        shell: bash
        run: |
          git clone --depth 1 --branch v1.9.4 https://github.com/ggml-org/whisper.cpp.git build/whisper.cpp
          cd build/whisper.cpp
          cmake -B build-static -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=OFF \
            -DGGML_OPENMP=OFF -DWHISPER_BUILD_TESTS=OFF -DWHISPER_BUILD_SERVER=OFF \
            -DWHISPER_BUILD_EXAMPLES=ON
          cmake --build build-static --config Release -j"$(nproc)"

      - name: Build whisper.cpp (CUDA, Windows x64)
        id: cuda
        continue-on-error: true
        shell: bash
        run: |
          if [ -z "$CUDA_PATH" ]; then echo "CUDA_PATH not set"; exit 1; fi
          cd build/whisper.cpp
          cmake -B build-cuda -A x64 -DGGML_CUDA=ON -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=OFF -DWHISPER_BUILD_TESTS=OFF -DWHISPER_BUILD_SERVER=OFF \
            -DWHISPER_BUILD_EXAMPLES=ON
          cmake --build build-cuda --config Release --target whisper-cli -j"$(nproc)"
          mkdir -p "$GITHUB_WORKSPACE/cuda-out"
          cp build-cuda/bin/Release/whisper-cli.exe "$GITHUB_WORKSPACE/cuda-out/"
          cp "$CUDA_PATH"/bin/cudart64_*.dll "$GITHUB_WORKSPACE/cuda-out/" || true
          cp "$CUDA_PATH"/bin/cublas64_*.dll "$GITHUB_WORKSPACE/cuda-out/" || true
          cp "$CUDA_PATH"/bin/cublasLt64_*.dll "$GITHUB_WORKSPACE/cuda-out/" || true
          ls -la "$GITHUB_WORKSPACE/cuda-out"

      - name: Fetch pinned FFmpeg and stage Windows runtime
        shell: bash
        env:
          FT_WHISPER_WIN_BIN: ${{ github.workspace }}/build/whisper.cpp/build-static/bin/Release/whisper-cli.exe
        run: |
          if [ -f "$GITHUB_WORKSPACE/cuda-out/whisper-cli.exe" ]; then
            export FT_WHISPER_WIN_CUDA_DIR="$GITHUB_WORKSPACE/cuda-out"
            echo "Staging CUDA runtime from cuda-out."
          else
            echo "No CUDA runtime built; packaging CPU runtime only."
          fi
          node scripts/fetch-runtime-windows.js

      - name: Lint and unit tests
        run: |
          npm run lint
          node --test tests/unit/*.test.js

      - name: Security check
        run: node scripts/security-check.js

      # Builds the NSIS installer (the auto-update payload) and the portable
      # zip, and writes latest.yml (updater metadata) next to them.
      - name: Build installer, portable and updater metadata
        run: npx electron-builder --win nsis zip --x64 --publish never

      - name: Upload Windows artefacts
        uses: actions/upload-artifact@v4
        with:
          name: forensic-transcriber-windows
          path: |
            release/ForensicTranscriber-Setup-x64.exe
            release/ForensicTranscriber-Portable-x64.zip
            release/latest.yml
          if-no-files-found: error

  model-package:
    needs: verify-version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.verify-version.outputs.tag }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Download default models
        run: |
          mkdir -p models
          curl -sL -o models/ggml-large-v3-turbo-q5_0.bin \
            "https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-large-v3-turbo-q5_0.bin"
          curl -sL -o models/ggml-silero-v5.1.2.bin \
            "https://huggingface.co/ggml-org/whisper-vad/resolve/main/ggml-silero-v5.1.2.bin"
          echo "394221709cd5ad1f40c46e6031ca61bce88931e6e088c188294c6d5a55ffa7e2  models/ggml-large-v3-turbo-q5_0.bin" | sha256sum -c -
          echo "29940d98d42b91fbd05ce489f3ecf7c72f0a42f027e4875919a28fb4c04ea2cf  models/ggml-silero-v5.1.2.bin" | sha256sum -c -
      - name: Build offline model package
        run: node scripts/build-model-package.js --models-dir models --out release
      - name: Upload model package
        uses: actions/upload-artifact@v4
        with:
          name: forensic-transcriber-model-package
          path: release/ForensicTranscriber-ModelPack-*.zip
          if-no-files-found: error

  publish:
    needs: [verify-version, build-windows, model-package]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm ci || npm install

      - name: Download artefacts
        uses: actions/download-artifact@v4
        with:
          path: artefacts
          merge-multiple: true

      - name: Verify the complete artefact set is present
        run: |
          set -e
          missing=0
          for f in ForensicTranscriber-Setup-x64.exe ForensicTranscriber-Portable-x64.zip latest.yml; do
            if ! find artefacts -type f -name "$f" | grep -q .; then echo "MISSING: $f"; missing=1; fi
          done
          if ! find artefacts -type f -name 'ForensicTranscriber-ModelPack-*.zip' | grep -q .; then
            echo "MISSING: ForensicTranscriber-ModelPack-*.zip"; missing=1
          fi
          # Guard: a Linux build must never be published as a Windows artefact.
          if find artefacts -type f \( -name '*.AppImage' -o -name '*.deb' -o -name '*-linux*' \) | grep -q .; then
            echo "Linux artefacts present; refusing to publish them as Windows assets."; missing=1
          fi
          if [ "$missing" -ne 0 ]; then echo "Release would reference nonexistent or wrong assets."; exit 1; fi
          echo "All expected artefacts present."

      - name: Verify updater metadata references the installer
        run: node scripts/verify-updater-metadata.js --file artefacts/latest.yml --version "${{ needs.verify-version.outputs.version }}"

      - name: Generate combined SHA256SUMS
        run: |
          set -e
          cd artefacts
          rm -f SHA256SUMS.txt
          find . -type f \( -name '*.exe' -o -name '*.zip' \) -print0 \
            | sort -z | xargs -0 sha256sum | sed 's#  ./#  #' > SHA256SUMS.txt
          echo "--- SHA256SUMS.txt ---"
          cat SHA256SUMS.txt

      - name: Publish the GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.verify-version.outputs.tag }}
          name: Forensic Transcriber ${{ needs.verify-version.outputs.version }}
          files: |
            artefacts/ForensicTranscriber-Setup-x64.exe
            artefacts/ForensicTranscriber-Portable-x64.zip
            artefacts/latest.yml
            artefacts/ForensicTranscriber-ModelPack-*.zip
            artefacts/SHA256SUMS.txt
          generate_release_notes: true
